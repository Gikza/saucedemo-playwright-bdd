name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Tests BDD con Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar los tests
        run: npm test

      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
